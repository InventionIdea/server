spring:
  datasource:
    # Supabase connection URL
    # For transaction pooler (recommended): jdbc:postgresql://[host]:6543/postgres?sslmode=require
    # For session pooler: jdbc:postgresql://[host]:5432/postgres?sslmode=require
    url: ${SUPABASE_URL}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool settings optimized for Supabase transaction pooling
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate.default_schema: public
      hibernate.jdbc.time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

cloud:
  aws:
    s3:
      endpoint: ${R2_ENDPOINT}
      bucket: ${R2_BUCKET}
      public-url-base: ${R2_PUBLIC_URL_BASE:}  # Optional: Custom public URL base (e.g., https://your-domain.com)
    credentials:
      access-key: ${R2_ACCESS_KEY}
      secret-key: ${R2_SECRET_KEY}
    region:
      static: auto